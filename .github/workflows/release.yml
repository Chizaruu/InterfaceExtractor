name: Visual Studio Extension Release

permissions:
  contents: write  # Needed for creating releases and pushing tags

on:
  push:
    branches:
      - main
      - dev
    paths:
      - '**.cs'
      - '**.csproj'
      - '**.xaml'
      - '**.vsct'
      - '**.vsixmanifest'
      - '.github/workflows/release.yml'

# Prevent multiple releases from running simultaneously
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false  # Don't cancel releases, queue them

jobs:
  build-and-publish:
    runs-on: windows-latest

    # Require environment approval based on branch
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'development' }}
      url: https://github.com/${{ github.repository }}/releases

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2
      
      # Cache NuGet packages
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            ${{ github.workspace }}/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      
      - name: Restore NuGet packages
        run: nuget restore InterfaceExtractor.Extension/InterfaceExtractor.Extension.csproj
      
      - name: Determine version bump type
        id: version-bump
        shell: bash
        run: |
          # Get the last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "Last tag: $LAST_TAG"
          
          # Get commits since last tag
          COMMITS=$(git log ${LAST_TAG}..HEAD --pretty=format:"%s" 2>/dev/null || git log --pretty=format:"%s")
          echo "Analyzing commits:"
          echo "$COMMITS"
          
          # Determine bump type based on conventional commits
          BUMP_TYPE="patch"
          
          # Check for breaking changes (major version)
          if echo "$COMMITS" | grep -qiE "^(BREAKING CHANGE|.*!:)"; then
            BUMP_TYPE="major"
            echo "🚨 Breaking change detected → MAJOR version bump"
          # Check for features (minor version)
          elif echo "$COMMITS" | grep -qiE "^feat(\(.*\))?:"; then
            BUMP_TYPE="minor"
            echo "✨ New feature detected → MINOR version bump"
          # Check for fixes (patch version)
          elif echo "$COMMITS" | grep -qiE "^fix(\(.*\))?:"; then
            BUMP_TYPE="patch"
            echo "🐛 Bug fix detected → PATCH version bump"
          # Check for other conventional commit types
          elif echo "$COMMITS" | grep -qiE "^(chore|docs|style|refactor|perf|test|build|ci)(\(.*\))?:"; then
            BUMP_TYPE="patch"
            echo "🔧 Maintenance commit detected → PATCH version bump"
          else
            BUMP_TYPE="patch"
            echo "📝 No conventional commit detected → Default PATCH version bump"
          fi
          
          echo "BUMP_TYPE=$BUMP_TYPE" >> $GITHUB_OUTPUT
      
      - name: Auto-increment version
        id: version
        shell: pwsh
        run: |
          # Read current version from vsixmanifest using PowerShell XML parsing
          $manifestFile = "InterfaceExtractor.Extension/source.extension.vsixmanifest"
          
          # Load XML properly
          [xml]$manifest = Get-Content $manifestFile
          $currentVersion = $manifest.PackageManifest.Metadata.Identity.Version
          
          if ([string]::IsNullOrEmpty($currentVersion)) {
            Write-Host "❌ Could not read version from manifest"
            exit 1
          }
          
          Write-Host "Current version: $currentVersion"
          
          $bumpType = "${{ steps.version-bump.outputs.BUMP_TYPE }}"
          $branchName = "${{ github.ref_name }}"
          
          # Parse version components
          $versionParts = $currentVersion.Split('.')
          $major = [int]$versionParts[0]
          $minor = [int]$versionParts[1]
          $patch = [int]$versionParts[2]
          
          # Determine new version based on bump type
          if ($bumpType -eq "major") {
            $major++
            $minor = 0
            $patch = 0
          }
          elseif ($bumpType -eq "minor") {
            $minor++
            $patch = 0
          }
          else {
            $patch++
          }
          
          $baseVersion = "$major.$minor.$patch"
          
          # Determine prerelease type based on branch
          if ($branchName -like "*testing*") {
            # Testing branches: find the next testing prerelease number
            $lastTestingTag = git tag -l "v$baseVersion-testing.*" --sort=-version:refname | Select-Object -First 1
            
            if ([string]::IsNullOrEmpty($lastTestingTag)) {
              $prereleaseNum = 0
            }
            elseif ($lastTestingTag -match 'testing\.(\d+)') {
              $prereleaseNum = [int]$matches[1] + 1
            }
            else {
              Write-Host "⚠️ Warning: Could not parse testing tag '$lastTestingTag', starting from 0"
              $prereleaseNum = 0
            }
            
            $prereleaseNum = $prereleaseNum.ToString("00")
            $newVersion = "$baseVersion.$prereleaseNum"
            $displayVersion = "$baseVersion-testing.$prereleaseNum"
            $isPrerelease = "true"
            $tagName = "v$displayVersion"
            $releaseName = "v$displayVersion 🧪 Testing Release"
            $releaseType = "testing"
            Write-Host "🧪 Testing version: $displayVersion"
          }
          elseif ($branchName -eq "dev") {
            # Dev branch: find the next dev prerelease number
            $lastDevTag = git tag -l "v$baseVersion-dev.*" --sort=-version:refname | Select-Object -First 1
            
            if ([string]::IsNullOrEmpty($lastDevTag)) {
              $prereleaseNum = 0
            }
            elseif ($lastDevTag -match 'dev\.(\d+)') {
              $prereleaseNum = [int]$matches[1] + 1
            }
            else {
              Write-Host "⚠️ Warning: Could not parse dev tag '$lastDevTag', starting from 0"
              $prereleaseNum = 0
            }
            
            $prereleaseNum = $prereleaseNum.ToString("00")
            $newVersion = "$baseVersion.$prereleaseNum"
            $displayVersion = "$baseVersion-dev.$prereleaseNum"
            $isPrerelease = "true"
            $tagName = "v$displayVersion"
            $releaseName = "v$displayVersion 🔧 Dev Release"
            $releaseType = "dev"
            Write-Host "🔧 Dev version: $displayVersion"
          }
          else {
            # Main branch: production release
            $newVersion = "$baseVersion.0"
            $displayVersion = $baseVersion
            $isPrerelease = "false"
            $tagName = "v$displayVersion"
            $releaseName = "v$displayVersion Release"
            $releaseType = "production"
            Write-Host "📦 Production version: $displayVersion ($bumpType bump)"
          }
          
          Write-Host "New version will be: $newVersion (display: $displayVersion)"
          
          # Update version in XML using proper XML manipulation
          $manifest.PackageManifest.Metadata.Identity.Version = $newVersion
          $manifest.Save((Resolve-Path $manifestFile))
          
          # Verify the change
          [xml]$verifyManifest = Get-Content $manifestFile
          $newVersionCheck = $verifyManifest.PackageManifest.Metadata.Identity.Version
          Write-Host "Verified new version in manifest: $newVersionCheck"
          
          if ($newVersionCheck -ne $newVersion) {
            Write-Host "❌ Version update failed!"
            exit 1
          }
          
          # Set outputs
          "VERSION=$newVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "DISPLAY_VERSION=$displayVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "TAG_NAME=$tagName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "BUMP_TYPE=$bumpType" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "IS_PRERELEASE=$isPrerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "RELEASE_NAME=$releaseName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "RELEASE_TYPE=$releaseType" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      
      - name: Commit and push version bump
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Check if there are changes to commit
          if git diff --quiet InterfaceExtractor.Extension/source.extension.vsixmanifest; then
            echo "ℹ️ No version changes to commit (version already up to date)"
          else
            echo "📝 Committing version bump to ${{ steps.version.outputs.VERSION }}"
            git add InterfaceExtractor.Extension/source.extension.vsixmanifest
            git commit -m "chore: bump version to ${{ steps.version.outputs.VERSION }} [skip ci]"
            git push
            echo "✅ Version bump committed and pushed"
          fi
      
      - name: Build Extension
        run: msbuild InterfaceExtractor.Extension/InterfaceExtractor.Extension.csproj /p:Configuration=Release /p:DeployExtension=false /p:ZipPackageCompressionLevel=normal /v:minimal /m
      
      - name: Locate VSIX file
        id: locate-vsix
        shell: bash
        run: |
          VSIX_PATH=$(find InterfaceExtractor.Extension/bin/Release -name "*.vsix" | head -1)
          if [ -z "$VSIX_PATH" ]; then
            echo "❌ VSIX file not found!"
            exit 1
          fi
          echo "✅ Found VSIX: $VSIX_PATH"
          
          # Rename VSIX to include version
          VSIX_DIR=$(dirname "$VSIX_PATH")
          NEW_VSIX_NAME="InterfaceExtractor-${{ steps.version.outputs.DISPLAY_VERSION }}.vsix"
          NEW_VSIX_PATH="$VSIX_DIR/$NEW_VSIX_NAME"
          mv "$VSIX_PATH" "$NEW_VSIX_PATH"
          echo "📦 Renamed to: $NEW_VSIX_PATH"
          
          echo "VSIX_PATH=$NEW_VSIX_PATH" >> $GITHUB_OUTPUT
          echo "VSIX_NAME=$NEW_VSIX_NAME" >> $GITHUB_OUTPUT
      
      - name: Create and push git tag
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.TAG_NAME }}" -m "Release ${{ steps.version.outputs.TAG_NAME }}"
          git push origin "${{ steps.version.outputs.TAG_NAME }}"
      
      - name: Generate release notes
        id: release-notes
        shell: pwsh
        run: |
          $releaseType = "${{ steps.version.outputs.RELEASE_TYPE }}"
          $displayVersion = "${{ steps.version.outputs.DISPLAY_VERSION }}"
          
          # Extract base version (e.g., "1.0.1" from "1.0.1-dev.02")
          $baseVersion = $displayVersion -replace '-.*$', ''
          
          # Find the last tag of the same type and base version
          if ($releaseType -eq "testing") {
            $lastTag = git tag -l "v$baseVersion-testing.*" --sort=-version:refname | Select-Object -Skip 1 -First 1
            
            # If no previous tag with same base version, find last testing tag of any version
            if ([string]::IsNullOrEmpty($lastTag)) {
              $lastTag = git tag -l "v*-testing.*" --sort=-version:refname | Select-Object -First 1
            }
          }
          elseif ($releaseType -eq "dev") {
            $lastTag = git tag -l "v$baseVersion-dev.*" --sort=-version:refname | Select-Object -Skip 1 -First 1
            
            # If no previous tag with same base version, find last dev tag of any version
            if ([string]::IsNullOrEmpty($lastTag)) {
              $lastTag = git tag -l "v*-dev.*" --sort=-version:refname | Select-Object -First 1
            }
          }
          else {
            $lastTag = git tag -l "v*" --sort=-version:refname | Where-Object { $_ -notmatch "-" } | Select-Object -Skip 1 -First 1
          }
          
          # Get tag info and commit SHA
          if ([string]::IsNullOrEmpty($lastTag)) {
            $tagInfo = "First $releaseType release"
            $lastCommitSha = ""
            $sinceParam = ""
          }
          else {
            $tagInfo = "Since $lastTag"
            $lastCommitSha = git rev-list -n 1 $lastTag
            
            # Get the commit date for the 'since' parameter to optimize API call
            $lastCommitDate = git log -1 --format=%cI $lastTag
            $sinceParam = "&since=$lastCommitDate"
          }
          
          # Get commits with GitHub usernames using GitHub API
          $commits = ""
          try {
            Write-Host "Fetching commits from GitHub API..."
            
            $apiResponse = gh api --paginate "repos/${{ github.repository }}/commits?sha=${{ github.sha }}&per_page=100$sinceParam" --jq '.[] | "\(.commit.message | split("\n")[0])||\(.author.login // "unknown")||\(.sha)"' 2>&1
            
            # Check if gh command actually failed (non-zero exit code)
            if ($LASTEXITCODE -ne 0) {
              throw "gh api command failed with exit code $LASTEXITCODE"
            }
            
            # Process response even if empty
            $commitList = @()
            if ($apiResponse) {
              foreach ($line in $apiResponse) {
                # Skip error messages that might have been captured
                if ($line -match '^\s*$' -or $line -like '*error*' -or $line -like '*warning*') {
                  continue
                }
                
                $parts = $line -split '\|\|'
                if ($parts.Count -lt 3) {
                  continue
                }
                
                $message = $parts[0]
                $author = $parts[1]
                $sha = $parts[2]
                
                # Skip the version bump commit itself
                if ($message -match '^\s*chore:\s*bump version') {
                  continue
                }
                
                if (![string]::IsNullOrEmpty($lastCommitSha) -and $sha -eq $lastCommitSha) {
                  break
                }
                
                # Use short SHA (7 chars) for display only
                $shortSha = $sha.Substring(0, 7)
                $commitList += "- $message by @$author ($shortSha)"
              }
            }
            
            if ($commitList.Count -gt 0) {
              $commits = $commitList -join "`n"
              Write-Host "✅ Successfully fetched $($commitList.Count) commits with GitHub usernames"
            }
            else {
              Write-Host "⚠️ No commits returned from GitHub API, falling back to git log..."
              throw "No commits in API response"
            }
          }
          catch {
            Write-Host "⚠️ GitHub API fetch issue: $_"
            Write-Host "Falling back to git log..."
            
            # Fallback to simple git log
            if ([string]::IsNullOrEmpty($lastTag)) {
              $commits = git log --first-parent --pretty=format:"- %s (%h)" --reverse --grep="^chore: bump version" --invert-grep
            }
            else {
              $commits = git log --first-parent "$lastTag..HEAD" --pretty=format:"- %s (%h)" --reverse --grep="^chore: bump version" --invert-grep
            }
            
            if (![string]::IsNullOrEmpty($commits)) {
              Write-Host "✅ Successfully fetched commits using git log"
            }
          }
          
          # If no commits found, add a placeholder
          if ([string]::IsNullOrEmpty($commits)) {
            $commits = "- Initial release"
          }
          
          # Build installation instructions (fixed newlines)
          $installation = "## Installation`n`n"
          $installation += "1. Download the ``.vsix`` file below`n"
          $installation += "2. Double-click to install in Visual Studio`n"
          $installation += "3. Or use: ``Extensions > Manage Extensions > Install from file```n"
          
          # Build release body
          $releaseBody = ""
          
          if ("${{ steps.version.outputs.IS_PRERELEASE }}" -eq "true") {
            $releaseBody += "## Pre-release`n`n"
            $releaseBody += "**Version:** v$displayVersion`n"
            $releaseBody += "**Commit:** ${{ github.sha }}`n`n"
            $releaseBody += "**Changes ($tagInfo):**`n"
            $releaseBody += "$commits`n`n"
            $releaseBody += $installation
          }
          else {
            $emoji = switch ("${{ steps.version-bump.outputs.BUMP_TYPE }}") {
              "major" { "🚨 Major" }
              "minor" { "✨ Minor" }
              default { "🐛 Patch" }
            }
            
            $releaseBody += "## $emoji Version Bump`n`n"
            $releaseBody += "**Version:** v$displayVersion`n`n"
            $releaseBody += "**Changes ($tagInfo):**`n"
            $releaseBody += "$commits`n`n"
            $releaseBody += $installation
          }
          
          $releaseBody | Out-File -FilePath release-notes.txt -Encoding utf8
        env:
          GH_TOKEN: ${{ github.token }}
      
      - name: Create GitHub Release with VSIX
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG_NAME }}
          name: ${{ steps.version.outputs.RELEASE_NAME }}
          body_path: release-notes.txt
          draft: false
          prerelease: ${{ steps.version.outputs.IS_PRERELEASE }}
          files: |
            ${{ steps.locate-vsix.outputs.VSIX_PATH }}
          token: ${{ secrets.GITHUB_TOKEN }}